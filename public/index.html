<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilimdon</title>
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <!-- Boshlang'ich ekran: kategoriya tanlash -->
    <section id="start-screen">
      <h1>Bilimdon</h1>
      <p>Ismingizni yozing va kategoriyani tanlang. Har savolga 15 soniya beriladi.</p>
      <input id="player-name" type="text" maxlength="20" placeholder="Ismingiz" autocomplete="off">
      <div id="categories"></div>
      <button id="show-board" class="link-btn">Reyting</button>
    </section>

    <!-- Savol ekrani -->
    <section id="quiz-screen" class="hidden">
      <div class="top">
        <span id="progress">1 / 10</span>
        <span id="timer">15</span>
        <span id="score">Ball: 0</span>
      </div>
      <div class="timer-track"><div id="timer-bar"></div></div>
      <h2 id="question"></h2>
      <div id="options"></div>
      <button id="next-btn" class="primary hidden">Keyingi</button>
    </section>

    <!-- Natija ekrani -->
    <section id="result-screen" class="hidden">
      <h1>Natija</h1>
      <p id="final-score"></p>
      <p id="message"></p>
      <h3>Reyting</h3>
      <div id="result-period" class="tabs"></div>
      <div id="result-tabs" class="tabs"></div>
      <ol id="result-board" class="board"></ol>
      <button id="restart-btn" class="primary">Bosh menyu</button>
    </section>
    <!-- Reyting ekrani -->
    <section id="board-screen" class="hidden">
      <h1>Reyting</h1>
      <div id="main-period" class="tabs"></div>
      <div id="main-tabs" class="tabs"></div>
      <ol id="main-board" class="board"></ol>
      <button id="board-back" class="primary">Orqaga</button>
    </section>
  </main>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
